# FlagScope stack: Flagsmith (official compose, pinned) + Grafana with the FlagScope plugin + one-shot bootstrap.
# Based on https://docs.flagsmith.com/deployment/docker (unchanged copy in docker-compose.orig.yml).
# Start: docker compose up -d --wait    (bootstrap runs last, credentials land in .generated/credentials.txt)
# Startup order: postgres -> migrate-db -> db-roles + flagsmith + task processor -> gatekeeper + grafana -> bootstrap
# Host ports and the credentials folder can be overridden (see .env.example) to run a second, isolated copy.

name: flagscope

x-flagsmith-env: &flagsmith-env
  # All environments variables are available here:
  # API: https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # UI: https://docs.flagsmith.com/deployment/locally-frontend#environment-variables

  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true' # Store API and Flag Analytics data in Postgres
  ENVIRONMENT: production # set to 'production' in production.
  DJANGO_ALLOWED_HOSTS: '*' # Change this in production
  FLAGSMITH_DOMAIN: localhost:8000 # Change this in production
  DJANGO_SECRET_KEY: secret # Change this in production
  WAREHOUSE_CREDENTIALS_SECRET: secret # Change this in production
  # PREVENT_SIGNUP: 'true' # Uncomment to prevent any additional signups
  # ALLOW_REGISTRATION_WITHOUT_INVITE: 'true' # Uncomment and set to false to only allow signups via invitations

  # Enable Task Processor
  TASK_RUN_METHOD: TASK_PROCESSOR # other options are: SYNCHRONOUSLY, SEPARATE_THREAD (default)
  PROMETHEUS_ENABLED: 'true'

  # Uncomment if you want to enable Google OAuth. Note this does not turn Google OAuth on. You still need to use
  # Flagsmith on Flagsmith to enable it - https://docs.flagsmith.com/deployment/#oauth_google
  # DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: 'same-origin-allow-popups'

  # For more info on configuring E-Mails - https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # Example SMTP:
  # EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  # EMAIL_HOST: mail.example.com
  # SENDER_EMAIL: flagsmith@example.com
  # EMAIL_HOST_USER: flagsmith@example.com
  # EMAIL_HOST_PASSWORD: smtp_account_password
  # EMAIL_PORT: 587 # optional
  # EMAIL_USE_TLS: 'true' # optional

  # Lets you try out experimentation by storing SDK events in the Postgres database above.
  # For production, connect a dedicated warehouse.
  EXPERIMENTATION_ENABLED: 'true'

  # FlagScope addition: Flagsmith blocks private-network URLs (SSRF guard) unless the host is allow-listed.
  # Needed so the Grafana integration can call http://grafana.flagscope.local:3000 inside the compose network.
  # The host needs a dot (Django URLValidator rejects bare "grafana"), hence the network alias below.
  SSRF_ALLOWED_HOSTS: grafana.flagscope.local

volumes:
  pgdata:
  grafana-data:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - ${FLAGSMITH_PORT:-8000}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness/', timeout=3)"
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 10s
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  # The flagsmith_processor service is only needed if TASK_RUN_METHOD set to TASK_PROCESSOR
  # in the application environment
  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    environment:
      <<: *flagsmith-env
    ports:
      - ${TASK_PROCESSOR_PORT:-8001}:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor

  # FlagScope addition: allow-list proxy in front of Flagsmith. It, and only it, holds the Flagsmith master key: Grafana's
  # FlagScope data source points here and has no key at all. Only the exact method + path pairs the plugin uses are
  # forwarded, everything else answers 403 (see gatekeeper/gatekeeper.mjs and its tests). No published port: it is only
  # reachable from other containers on this compose network. The key file is written by bootstrap.mjs into a folder that
  # holds nothing else, so this container cannot read the Flagsmith or Grafana passwords.
  gatekeeper:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', '/app/gatekeeper.mjs']
    environment:
      UPSTREAM_URL: http://flagsmith:8000
      MASTER_KEY_FILE: /secrets/master-key
      # Secret Feature Health webhook path (bootstrap writes it). Grafana's alert contact point posts to
      # http://gatekeeper:8080/hooks/feature-health instead, so the secret never sits in a Grafana contact point.
      FEATURE_HEALTH_PATH_FILE: /secrets/feature-health-path
      PORT: '8080'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./gatekeeper/gatekeeper.mjs:/app/gatekeeper.mjs:ro
      - ${GENERATED_DIR:-./.generated}/gatekeeper:/secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    depends_on:
      flagsmith:
        condition: service_healthy

  # FlagScope addition: Grafana OSS with the FlagScope plugin dist mounted (unsigned plugin allowed), the
  # Experiment Room dashboard and the SRM alert rule provisioned. Anonymous access is enabled as Viewer for the demo: safe here because the
  # FlagScope data source only reaches Flagsmith through the gatekeeper, and results refresh stays Admin-only.
  grafana:
    image: grafana/grafana:13.2.7
    restart: unless-stopped
    networks:
      default:
        aliases:
          - grafana.flagscope.local
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in stack/.env}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: abhi0404-flagscope-datasource
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/flagscope/dashboards/experiment-room.json
    depends_on:
      flagsmith:
        condition: service_healthy
    volumes:
      - ../plugin/dist:/var/lib/grafana/plugins/abhi0404-flagscope-datasource:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/flagscope/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # FlagScope addition: read-only Postgres role for Grafana. One-shot and idempotent, so it also works on an
  # existing volume (docker-entrypoint-initdb.d would only run on an empty one, and before the tables exist).
  db-roles:
    image: postgres:15.5-alpine
    restart: 'no'
    environment:
      PGPASSWORD: password
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:-flagscope-ro}
    volumes:
      - ./postgres-init/01-readonly.sql:/sql/01-readonly.sql:ro
    entrypoint:
      - sh
      - -c
      - psql -h postgres -U postgres -d flagsmith -v ON_ERROR_STOP=1 -v ro_password="$$GRAFANA_RO_PASSWORD" -f /sql/01-readonly.sql
    depends_on:
      postgres:
        condition: service_healthy
      migrate-db:
        condition: service_completed_successfully

  # FlagScope addition: one-shot bootstrap (zero dependencies, Node 22 native fetch). Idempotent: running it again is a
  # no-op. Writes credentials.txt and state.json to the generated folder (gitignored).
  bootstrap:
    image: node:22-alpine
    restart: 'no'
    working_dir: /app
    # Stays alive after a successful run (idle `tail`) so `docker compose up --wait` can see it turn healthy;
    # a failed bootstrap exits non-zero and fails the `up`. Re-run on demand: docker compose run --rm bootstrap node /app/bootstrap.mjs
    command: ['sh', '-c', 'node /app/bootstrap.mjs && exec tail -f /dev/null']
    environment:
      FLAGSMITH_URL: http://flagsmith:8000
      GRAFANA_URL: http://grafana:3000
      GATEKEEPER_URL: http://gatekeeper:8080
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in stack/.env}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:-flagscope-ro}
      PUBLIC_FLAGSMITH_URL: http://localhost:${FLAGSMITH_PORT:-8000}
      PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
    # Healthy only once bootstrap finished OK, so `docker compose up -d --wait` returns when the stack is really ready.
    healthcheck:
      test: ['CMD', 'test', '-f', '/generated/.bootstrap-ok']
      interval: 2s
      timeout: 2s
      retries: 150
      start_period: 2s
    volumes:
      - ./bootstrap.mjs:/app/bootstrap.mjs:ro
      - ${GENERATED_DIR:-./.generated}:/generated
    depends_on:
      flagsmith:
        condition: service_healthy
      grafana:
        condition: service_healthy
      gatekeeper:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
